<!DOCTYPE html>
<html>
<head>
  <title>YouTube Analysis Pro</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <style>
    body { font-family: Arial; background: #0f172a; color: white; padding: 20px; }
    input, button { padding: 10px; margin-top: 10px; width: 100%; }
    .card { background: #1e293b; padding: 15px; margin-top: 10px; border-radius: 10px; }
  </style>
</head>
<body>

<h1>YouTube Analysis Pro 🚀</h1>

<input id="topic" placeholder="Enter topic..." />
<button onclick="generate()">Generate Content</button>

<div id="output"></div>

<script>
function generate() {
  const topic = document.getElementById('topic').value;

  document.getElementById('output').innerHTML = `
    <div class='card'><b>Title:</b> ${topic} Strategy That Works</div>
    <div class='card'><b>Hook:</b> Stop scrolling, this ${topic} method is powerful...</div>
    <div class='card'><b>Script:</b> Today we talk about ${topic} and how you can grow fast...</div>
  `;
}
</script>

</body>
</html>
